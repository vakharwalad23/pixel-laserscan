plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.vakharwalad23.lasercore'
version = '0.1.0'

// Build the native core only for the ABIs the app ships (same property RN uses).
def abiList = (findProperty('reactNativeArchitectures') ?: 'arm64-v8a').toString().split(',').collect { it.trim() }

android {
  namespace "dev.vakharwalad23.lasercore"
  ndkVersion rootProject.ext.has('ndkVersion') ? rootProject.ext.ndkVersion : '27.1.12297006'
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles 'proguard-rules.pro'
    ndk {
      abiFilters(*abiList)
    }
    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_shared"
      }
    }
  }
  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.22.1"
    }
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.google.ar:core:1.57.0'
  implementation 'androidx.core:core:1.13.1'
}
